<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Circle -->
  <circle cx="50" cy="50" r="45" stroke="currentColor" stroke-width="2.5" fill="none" />
  
  <!-- Nodes (Stars) -->
  <circle cx="60" cy="15" r="3" fill="currentColor" /> <!-- A -->
  <circle cx="25" cy="30" r="3" fill="currentColor" /> <!-- B -->
  <circle cx="85" cy="45" r="3" fill="currentColor" /> <!-- C -->
  <circle cx="75" cy="80" r="3" fill="currentColor" /> <!-- D -->
  <circle cx="30" cy="75" r="3" fill="currentColor" /> <!-- E -->
  <circle cx="50" cy="52" r="3" fill="currentColor" /> <!-- F (Center-ish) -->
  
  <!-- Connections -->
  <line x1="25" y1="30" x2="60" y2="15" stroke="currentColor" stroke-width="1.8" /> <!-- B-A -->
  <line x1="60" y1="15" x2="50" y2="52" stroke="currentColor" stroke-width="1.8" /> <!-- A-F -->
  <line x1="50" y1="52" x2="85" y2="45" stroke="currentColor" stroke-width="1.8" /> <!-- F-C -->
  <line x1="85" y1="45" x2="75" y2="80" stroke="currentColor" stroke-width="1.8" /> <!-- C-D -->
  <line x1="75" y1="80" x2="50" y2="52" stroke="currentColor" stroke-width="1.8" /> <!-- D-F -->
  <line x1="50" y1="52" x2="30" y2="75" stroke="currentColor" stroke-width="1.8" /> <!-- F-E -->
  <line x1="30" y1="75" x2="25" y2="30" stroke="currentColor" stroke-width="1.8" /> <!-- E-B -->
</svg>
