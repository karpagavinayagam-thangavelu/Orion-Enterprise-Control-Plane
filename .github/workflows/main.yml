name: Orion CD/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize Nx
        run: npx nx@latest init

      - name: Lint Affected
        run: npx nx affected -t lint

      - name: Test Affected
        run: npx nx affected -t test

      - name: Build Affected
        run: npx nx affected -t build

  # Optional: Trigger Render Deployments via Webhook
  # Only if you want to disable Render's auto-deploy and control it via GitHub
  deploy-backend:
    needs: validate-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          echo "Render's native Auto-Deploy is active. Pushing to main will trigger all blueprint services."
          # If you want to use webhooks instead, uncomment the lines below:
          # curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
